<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>首选项</title>
  <link rel="stylesheet" href="style.css?v=11">
  <script src="data.js?v=11" defer></script>
  <script src="preferences.js?v=11" defer></script>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <button id="open-preferences" hidden>首选项</button>
  <dialog id="preferences" aria-labelledby="page-title">
    <aside class="sidebar">
      <nav id="tabs" role="tablist" aria-label="首选项" aria-orientation="vertical"></nav>
    </aside>
    <div class="content">
      <div class="page-heading">
        <h2 id="page-title">界面</h2>
        <button id="close-preferences" type="button" aria-label="关闭" title="关闭">
          <span class="close-icon" aria-hidden="true"></span>
        </button>
      </div>
      <div class="dialog-body"><main id="panels"></main></div>
    </div>
  </dialog>
  <input id="image-picker" type="file" accept="image/png,image/jpeg,image/bmp,image/webp" hidden>
</body>
</html>
